; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; platform = nordicnrf52 @10.6.0
platform = nordicnrf52
; board = nrf52840_dk_adafruit
board =lilygo_t_impulse_plus_nrf52840
; upload_protocol = cmsis-dap
upload_protocol = nrfutil
; upload_protocol = jlink

framework = arduino
monitor_speed = 115200 ;Serial Baud Rate Setting

upload_speed = 115200 ; 460800, 512000, 460800, 256000, 115200 , 921600

build_flags =
    -std=c++11
    ; Keep framework debug and SystemView paths disabled for low-power builds.
    ; v2_bringup provides its own application-level log_printf() output.
    -D CFG_DEBUG=0
    -D CFG_LOGGER=0
    -D CFG_SYSVIEW=0

; Serial is provided by the nRF52 framework's TinyUSB CDC implementation.
; Keep the dependency tied to the installed framework package so every
; example links the same version as Arduino.h without a user-specific path.
lib_deps =
    file://${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino

extra_scripts = pre:tools/platformio_select_example.py

[platformio]
boards_dir = ./boards
lib_dir = ./libraries

src_dir = examples/${platformio.default_envs}
;default_envs = v2_ble_test
default_envs = v2_bringup
;default_envs = v2_lora_receive
;default_envs = v2_lora_external_antenna_transmit
;default_envs = v2_lora_transmit
;default_envs = v2_screen_test
;default_envs = v2_flash_test
;default_envs = v2_main_i2c_test
;default_envs = v2_sgm41562_test
;default_envs = v2_icm20948_test
;default_envs = v2_battery_test
;default_envs = v2_gnss_uart_test
;default_envs = v2_ttp223_test
;default_envs = v2_motor_test
[env:v2_bringup]
[env:v2_lora_test]
[env:v2_lora_receive]
[env:v2_lora_transmit]
[env:v2_lora_external_antenna_transmit]
[env:v2_screen_test]
